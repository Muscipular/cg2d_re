<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">骑自行车的鹈鹕</title>
  <desc id="desc">一只戴着蓝色围巾的白色鹈鹕，骑着珊瑚红自行车穿过海边小路。</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe9f4"/>
      <stop offset="1" stop-color="#f8edcf"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc95c"/>
      <stop offset="1" stop-color="#ed873f"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf4"/>
      <stop offset="1" stop-color="#dce5df"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <!-- 天空与远景 -->
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="132" cy="128" r="68" fill="#ffd66b" opacity="0.9"/>
  <g fill="#ffffff" opacity="0.72">
    <path d="M180 234c10-35 57-44 79-15 29-31 82-10 79 31h-158c-13-3-13-13 0-16z"/>
    <path d="M820 108c9-30 49-39 70-15 21-27 67-11 69 25h-139c-12-2-12-8 0-10z"/>
  </g>
  <path d="M0 500C180 452 315 475 465 495c166 23 299-52 430-34 122 17 206 63 305 29v310H0z" fill="#8fc9b4"/>
  <path d="M0 555c180-51 352-21 493 8 172 35 292-29 433-12 111 14 196 48 274 29v220H0z" fill="#f2cf83"/>
  <path d="M0 680c212-31 358-5 535 10 211 18 409-31 665-4v114H0z" fill="#d9955f"/>
  <path d="M0 704c219-18 389 14 581 15 214 2 400-36 619-8" fill="none" stroke="#f6c98d" stroke-width="9" stroke-linecap="round" opacity="0.75"/>

  <!-- 速度线与地面阴影 -->
  <g fill="none" stroke="#527d7b" stroke-linecap="round" opacity="0.45">
    <path d="M76 406h145" stroke-width="10"/>
    <path d="M113 444h78" stroke-width="7"/>
    <path d="M957 357h126" stroke-width="8"/>
  </g>
  <ellipse cx="608" cy="724" rx="410" ry="28" fill="#6f4b3a" opacity="0.22" filter="url(#softShadow)"/>

  <!-- 车轮 -->
  <g fill="none">
    <g stroke="#27313b" stroke-width="18">
      <circle cx="350" cy="585" r="151"/>
      <circle cx="850" cy="585" r="151"/>
    </g>
    <g stroke="#f7f3e8" stroke-width="5" opacity="0.95">
      <circle cx="350" cy="585" r="136"/>
      <circle cx="850" cy="585" r="136"/>
    </g>
    <g stroke="#70818a" stroke-width="3" opacity="0.78">
      <path d="M350 449v272M214 585h272M254 489l192 192M254 681l192-192M302 457l96 256M222 537l256 96M222 633l256-96M302 713l96-256"/>
      <path d="M850 449v272M714 585h272M754 489l192 192M754 681l192-192M802 457l96 256M722 537l256 96M722 633l256-96M802 713l96-256"/>
    </g>
    <g fill="#f6b643" stroke="#27313b" stroke-width="7">
      <circle cx="350" cy="585" r="16"/>
      <circle cx="850" cy="585" r="16"/>
    </g>
  </g>

  <!-- 自行车车架 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M350 585L525 424 610 585H350L725 438 850 585" stroke="#d84b44" stroke-width="18"/>
    <path d="M525 424h200" stroke="#d84b44" stroke-width="18"/>
    <path d="M725 438l125 147" stroke="#de5c4e" stroke-width="13"/>
    <path d="M704 442l47-77 50-4" stroke="#27313b" stroke-width="12"/>
    <path d="M779 361l28 19" stroke="#27313b" stroke-width="11"/>
    <path d="M516 421l-20-56" stroke="#27313b" stroke-width="11"/>
  </g>
  <path d="M463 360h88c10 0 16 9 10 18l-8 12h-91c-18 0-19-30 1-30z" fill="#27313b"/>
  <circle cx="610" cy="585" r="38" fill="#f6b643" stroke="#27313b" stroke-width="9"/>
  <circle cx="610" cy="585" r="11" fill="#27313b"/>
  <path d="M610 585l66 28m-66-28l-56-38" fill="none" stroke="#27313b" stroke-width="9" stroke-linecap="round"/>
  <path d="M658 612h48M518 546h47" fill="none" stroke="#27313b" stroke-width="11" stroke-linecap="round"/>

  <!-- 鹈鹕尾羽 -->
  <g fill="#f4f3e8" stroke="#33424a" stroke-width="6" stroke-linejoin="round">
    <path d="M421 332l-142-18 116 75z"/>
    <path d="M430 352l-146 26 131 35z"/>
    <path d="M440 370l-112 65 128-13z"/>
  </g>

  <!-- 鹈鹕身体 -->
  <path d="M397 356c8-88 89-139 184-127 104 13 161 78 145 157-17 83-101 111-204 87-86-19-133-63-125-117z" fill="url(#wing)" stroke="#33424a" stroke-width="8"/>
  <path d="M594 274c27-53 58-108 92-135 26-21 64-17 82 11 16 25 7 56-18 70-27 15-53 49-61 91" fill="none" stroke="#33424a" stroke-width="78" stroke-linecap="round"/>
  <path d="M594 274c27-53 58-108 92-135 26-21 64-17 82 11 16 25 7 56-18 70-27 15-53 49-61 91" fill="none" stroke="#fffdf4" stroke-width="63" stroke-linecap="round"/>

  <!-- 头与喙 -->
  <circle cx="730" cy="153" r="58" fill="#fffdf4" stroke="#33424a" stroke-width="8"/>
  <path d="M746 151c80-16 213-4 321 28-108 26-223 30-319 10z" fill="#f5b84c" stroke="#33424a" stroke-width="8" stroke-linejoin="round"/>
  <path d="M754 180c92 9 203 2 313-1-69 65-189 73-281 39-20-7-31-20-32-38z" fill="url(#pouch)" stroke="#33424a" stroke-width="8" stroke-linejoin="round"/>
  <path d="M777 177c100 9 194 3 290 2" fill="none" stroke="#c86b39" stroke-width="5" stroke-linecap="round"/>
  <circle cx="742" cy="136" r="13" fill="#33424a"/>
  <circle cx="746" cy="132" r="4" fill="#ffffff"/>

  <!-- 围巾 -->
  <path d="M670 221c28 20 61 23 92 8" fill="none" stroke="#2d80a7" stroke-width="19" stroke-linecap="round"/>
  <path d="M690 230c-40 44-88 61-137 50 27 22 60 34 94 32-35 12-70 8-102-4 47 44 105 42 158-43z" fill="#3197bd" stroke="#33424a" stroke-width="7" stroke-linejoin="round"/>

  <!-- 翅膀与握把 -->
  <path d="M506 298c43-33 107-10 139 31 30 38 55 64 112 67-35 42-98 32-143 7-49-27-92-56-108-105z" fill="#e6ece5" stroke="#33424a" stroke-width="8"/>
  <g fill="none" stroke="#b8c7c3" stroke-width="6" stroke-linecap="round">
    <path d="M529 316c41 40 76 66 132 82"/>
    <path d="M555 300c31 39 67 68 116 86"/>
    <path d="M587 306c24 32 51 52 91 67"/>
  </g>
  <path d="M744 389c18-9 38-2 46 16 7 16-1 34-19 40-16 5-33-4-37-21" fill="#f5b84c" stroke="#33424a" stroke-width="7" stroke-linecap="round"/>

  <!-- 双腿与踏板 -->
  <g fill="none" stroke="#e59645" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <path d="M520 429c20 42 43 72 89 108"/>
    <path d="M601 436c18 49 39 91 75 133"/>
  </g>
  <g fill="none" stroke="#33424a" stroke-width="8" stroke-linecap="round">
    <path d="M609 537c-9 12-25 15-40 8"/>
    <path d="M676 569c11 12 27 18 42 15"/>
  </g>

  <!-- 身体前景羽毛与细节 -->
  <path d="M410 350c35 15 55 45 49 88" fill="none" stroke="#c7d3cf" stroke-width="7" stroke-linecap="round"/>
  <path d="M446 326c29 17 47 41 49 70" fill="none" stroke="#c7d3cf" stroke-width="7" stroke-linecap="round"/>
  <path d="M415 444c37 22 76 32 116 35" fill="none" stroke="#33424a" stroke-width="7" stroke-linecap="round"/>

  <!-- 前灯与铃铛 -->
  <circle cx="782" cy="391" r="13" fill="#ffe27a" stroke="#33424a" stroke-width="6"/>
  <path d="M733 397c0-14 21-14 21 0z" fill="#f6b643" stroke="#33424a" stroke-width="5"/>
</svg>
